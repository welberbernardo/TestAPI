name: Build Maze Muncher APK
on:
  push:
    branches: [ maze-muncher-android-build ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: maze-muncher
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MazeMuncher-Android-APK
          path: maze-muncher/app/build/outputs/apk/debug/app-debug.apk
